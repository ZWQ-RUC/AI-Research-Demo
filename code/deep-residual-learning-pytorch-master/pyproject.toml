[project]
name = "deep-residual-learning-pytorch"
version = "0.1.0"
description = "PyTorch reproduction of Deep Residual Learning for Image Recognition (He et al., 2015)"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "tqdm>=4.60",
    "tensorboard>=2.12",
]

# Engineering-only: pin CUDA 11.8 wheels for RTX 3050 (driver CUDA 11.7).
# Default PyPI/uv.lock resolves to CPU wheels which make the full CIFAR suite impractical.
[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu118" }
torchvision = { index = "pytorch-cu118" }
