# Phase 5 Ablation B — drop second BN+ReLU from PreAct block
# Full PreAct: BN -> ReLU -> Conv -> BN -> ReLU -> Conv -> Add
# Ablation B:  BN -> ReLU -> Conv -> Conv -> Add

phase: phase5
idea_id: ablation_b_drop_second_preact
experiment_id: ablation_b
baseline_preact:
  model: PreAct-ResNet-20-A
  best_test_error_pct: 9.47
  artifact: experiments/runs/phase3/preact_resnet20a/CifarPreActResNet-20-R-A/09_03_2026/16_23_57
baseline_resnet:
  model: ResNet-20-A
  best_test_error_pct: 8.41
  artifact: experiments/runs/phase2/baseline/CifarResNet-20-R-A/09_03_2026/09_53_41

ablation:
  model: CifarPreActAblationB-20-R-A
  block: "BN -> ReLU -> Conv -> Conv -> Add"
  purpose: "verify role of second BN+ReLU in PreAct block"
  frozen_controls:
    dataset: CIFAR-10
    epochs: 160
    batch_size: 128
    optimizer: SGD
    momentum: 0.9
    weight_decay: 1.0e-4
    lr: 0.1
    lr_milestones_iters: [32000, 48000]
    augmentation: "RandomCrop(32, padding=4) + RandomHorizontalFlip + Normalize"
    evaluation: "test error every 4 epochs; best.pt by min test error"
    shortcut: A

cli: "train.py 20 -r -o A --ablation B --output-root <runs/phase5/ablation_b>"
raw_root: experiments/runs/phase5/ablation_b
