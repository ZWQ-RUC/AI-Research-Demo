# Phase 3 — Pre-activation ResNet-20-A
# Single change vs frozen Phase 2 ResNet-20-A: residual block order.

phase: phase3
idea_id: preact_resnet20a
baseline:
  model: ResNet-20-A (post-activation)
  artifact: experiments/runs/phase2/baseline/CifarResNet-20-R-A/09_03_2026/09_53_41
  best_test_error_pct: 8.41
  retrain: false

improved:
  model: Pre-activation ResNet-20-A
  block: "BN -> ReLU -> Conv -> BN -> ReLU -> Conv -> Add"
  shortcut: A
  frozen_controls:
    dataset: CIFAR-10
    epochs: 160
    batch_size: 128
    optimizer: SGD
    momentum: 0.9
    weight_decay: 1.0e-4
    lr: 0.1
    lr_milestones_iters: [32000, 48000]
    augmentation: "RandomCrop(32, padding=4) + RandomHorizontalFlip + Normalize"
    evaluation: "test error every 4 epochs; best.pt by min test error"
  excluded:
    - SE
    - attention
    - dropout
    - cutout
    - mixup

cli: "train.py 20 -r -o A --preact --output-root <runs/phase3/preact_resnet20a>"
raw_root: experiments/runs/phase3/preact_resnet20a
results: experiments/results/phase3/
