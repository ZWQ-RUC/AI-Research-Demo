# Phase 2 baseline — documented completed runs (do not retrain to “update” this file)

phase: phase2
experiment_id: baseline
frozen: true
paper: "Deep Residual Learning for Image Recognition (He et al., 2015)"
code: code/deep-residual-learning-pytorch-master
dataset: CIFAR-10
split: official_train_50k_test_10k

protocol:
  epochs: 160
  batch_size: 128
  optimizer: SGD
  momentum: 0.9
  weight_decay: 1.0e-4
  lr: 0.1
  lr_milestones_iters: [32000, 48000]
  augmentation: "RandomCrop(32, padding=4) + RandomHorizontalFlip + Normalize"
  primary_metric: best_test_error
  checkpoint_rule: "min test error every 4 epochs -> weights/best.pt"
  seed: null

environment:
  conda_env: deeplearn
  python: "3.9"
  torch: "2.0.1+cu117"
  device: "NVIDIA GeForce RTX 3050 Laptop GPU"

runs:
  - run_id: plain20_08_49_22
    display_name: Plain-20
    cli: "train.py 20"
    residual: false
    option: null
    artifact_root: experiments/runs/phase2/baseline/CifarResNet-20-P-N/09_03_2026/08_49_22
    best_test_error_pct: 9.68
    duration: "~01:04:19"

  - run_id: resnet20a_09_53_41
    display_name: ResNet-20-A
    cli: "train.py 20 -r -o A"
    residual: true
    option: A
    artifact_root: experiments/runs/phase2/baseline/CifarResNet-20-R-A/09_03_2026/09_53_41
    best_test_error_pct: 8.41
    duration: "~01:03:13"

launcher: experiments/launch/run_subset_20.ps1
manifest: experiments/manifests/phase2_baseline.json
results: experiments/results/phase2/
research: research/resnet-cifar10-baseline-20260902/

notes:
  - "Phase 2 raw artifacts remain under experiments/runs/phase2/baseline, experiments/runs/phase2/logs, experiments/results/phase2/figures."
  - "Do not overwrite these paths. Phase 3+ writes to experiments/runs/<phase>/<idea_id>/<run_id>/."
  - "Formal comparisons must use manifests, not discover_latest_run()."
